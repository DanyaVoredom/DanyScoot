name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Prepare
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "release tag must start with v"; exit 1 ;;
          esac
          version="${tag#v}"
          gradle_version="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/app/build.gradle.kts | head -n1)"
          if [ "$version" != "$gradle_version" ]; then
            echo "tag $tag does not match versionName $gradle_version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build
        run: |
          set -euo pipefail
          chmod +x app/gradlew
          cd app
          ./gradlew --no-daemon assembleRelease

      - name: Verify
        run: |
          set -euo pipefail
          apk="app/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          cp "$apk" "DanyScoot-$VERSION.apk"
          signer="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -n1)"
          "$signer" verify --print-certs "DanyScoot-$VERSION.apk"
          sha256sum "DanyScoot-$VERSION.apk" > "DanyScoot-$VERSION.apk.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body="$(awk -v v="$VERSION" '$0 ~ "^## " v { found=1; next } /^## / { found=0 } found' CHANGELOG.md)"
          if [ -z "$body" ]; then
            body="DanyScoot $VERSION"
          fi
          gh release delete "v$VERSION" --yes --cleanup-tag=false || true
          gh release create "v$VERSION" \
            "DanyScoot-$VERSION.apk" \
            "DanyScoot-$VERSION.apk.sha256" \
            --title "DanyScoot $VERSION" \
            --notes "$body"
