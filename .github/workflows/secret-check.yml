name: secret-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "len=${#KEYSTORE_BASE64}"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/dk.jks
          sha256sum /tmp/dk.jks
          keytool -list -v -keystore /tmp/dk.jks -storepass android -alias androiddebugkey | grep -i sha256
          ls -l "$HOME/.android" || true
          find / -name debug.keystore -not -path '*/proc/*' 2>/dev/null | head -n 5
